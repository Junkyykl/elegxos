<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Σάρωση QR — Είσοδος/Έξοδος</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html5-qrcode/2.3.8/html5-qrcode.min.js"></script>
<style>
    body { font-family: Arial, sans-serif; background:#f4f5f7; margin:0; padding:20px; text-align:center; }
    h1 { color:#1a3c6e; }
    #reader { width: 100%; max-width: 400px; margin: 0 auto; }
    #result {
        margin-top:20px; padding:16px; border-radius:8px; font-size:18px; min-height:60px;
    }
    .ok { background:#e3f7e8; color:#0a7d2c; }
    .err { background:#fde8e6; color:#c0392b; }
    a.button {
        display:inline-block; margin-top:16px; background:#1a3c6e; color:#fff; padding:10px 16px;
        border-radius:6px; text-decoration:none;
    }
</style>
</head>
<body>
    <h1>Σάρωση Κάρτας Οπλίτη</h1>
    <div id="reader"></div>
    <div id="result"></div>
    <a class="button" href="/">⬅ Πίσω στη Λίστα</a>

<script>
const resultDiv = document.getElementById('result');
let isProcessing = false;

function onScanSuccess(qr_token) {
    if (isProcessing) return;
    isProcessing = true;

    fetch('/api/scan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ qr_token })
    })
    .then(r => r.json())
    .then(data => {
        if (data.error) {
            resultDiv.className = 'err';
            resultDiv.innerText = data.error;
        } else {
            const katText = data.neaKatastasi === 'mesa' ? 'ΕΙΣΗΛΘΕ' : 'ΕΞΗΛΘΕ';
            let ypText = '';
            if (data.ypiresies && data.ypiresies.length) {
                ypText = ' | Υπηρεσίες σήμερα: ' + data.ypiresies.map(y => y.typos).join(', ');
            }
            resultDiv.className = 'ok';
            resultDiv.innerText = `${data.onomateponymo} — ${katText}${ypText}`;
        }
        setTimeout(() => { isProcessing = false; }, 2000);
    })
    .catch(() => {
        resultDiv.className = 'err';
        resultDiv.innerText = 'Σφάλμα επικοινωνίας με τον server.';
        isProcessing = false;
    });
}

const qrScanner = new Html5Qrcode("reader");
qrScanner.start(
    { facingMode: "environment" },
    { fps: 10, qrbox: 250 },
    onScanSuccess
).catch(err => {
    resultDiv.className = 'err';
    resultDiv.innerText = 'Δεν ήταν δυνατή η πρόσβαση στην κάμερα: ' + err;
});
</script>
</body>
</html>
